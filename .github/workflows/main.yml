jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    # This tells GitHub to run all commands inside your subfolder
    defaults:
      run:
        working-directory: ./Linguistic-Advocacy-Project
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # We tell setup-node where to find the lock file for caching
          cache: 'npm'
          cache-dependency-path: './Linguistic-Advocacy-Project/package-lock.json'
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Point to the dist folder inside the subfolder
          path: './Linguistic-Advocacy-Project/dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
